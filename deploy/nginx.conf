# 正式站点配置：HTTP 跳转 HTTPS，HTTPS 上提供前端静态文件并反向代理后端 API。
#
# 使用方式：证书签发成功后（见 nginx-bootstrap.conf），复制为 /etc/nginx/sites-available/arxiv-agent，
# 替换域名和证书路径，然后 sudo nginx -t && sudo systemctl reload nginx。
#
# 前端静态文件从 current 链接指向的版本目录读取：每次发布或失败回退切换 current 后，
# nginx 自动提供对应版本的前端，与后端保持同一版本，无需修改配置或 reload（见 docs/operations/cicd-deployment.md 第 10 节）。
#
# 请求流向：浏览器 --HTTPS--> nginx(443) --+-- 静态文件：直接从 root 目录返回
#                                          +-- /api/、/health：转发到 127.0.0.1:8001（gunicorn）

# 不记录查询参数和认证头，避免误传的凭据进入长期访问日志。
# 使用 $uri（不含 ?query）而非 $request（含完整请求行）。
log_format arxiv_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# ---------------- HTTP（80 端口）：只做证书续期和跳转 ----------------
server {
    listen 80;
    listen [::]:80;
    server_name arxiv.001769.xyz;

    # 续期仍走 HTTP-01；其他请求固定跳转到本站，不能用客户端 Host 拼接跳转目标。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    # 308 永久重定向：与 301 不同，308 要求浏览器保持原请求方法和请求体（POST 仍是 POST）。
    location / {
        return 308 https://arxiv.001769.xyz$request_uri;
    }
    access_log /var/log/nginx/arxiv-agent-access.log arxiv_safe;
}

# ---------------- HTTPS（443 端口）：实际对外提供服务 ----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arxiv.001769.xyz;

    # Let's Encrypt 证书：fullchain 包含站点证书和中间证书，privkey 为私钥。
    ssl_certificate /etc/letsencrypt/live/arxiv.001769.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arxiv.001769.xyz/privkey.pem;
    # 只允许 TLS 1.2 / 1.3，禁用已不安全的旧协议。
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 会话缓存（10MB 共享内存，有效期 1 天），减少重复握手开销。
    ssl_session_cache shared:arxiv_tls:10m;
    ssl_session_timeout 1d;
    # 关闭 session ticket：ticket 密钥长期不轮换会削弱前向保密。
    ssl_session_tickets off;
    server_tokens off;
    # 前端静态文件根目录；部署根目录下只有 releases/、current 等，不存在 frontend/，必须经由 current 访问。
    root /opt/arxiv-research-agent/current/frontend/dist;

    # 当前 API 接收 JSON，PDF 由后端下载；与 AUTH_MAX_REQUEST_BYTES 默认值保持一致。
    client_max_body_size 1m;
    # 客户端两次发送请求体数据的间隔超过 30 秒即断开，缓解慢速请求攻击。
    client_body_timeout 30s;

    # 安全响应头（always：错误响应如 4xx/5xx 也带上）：
    #   X-Content-Type-Options nosniff  禁止浏览器猜测 MIME 类型
    #   Referrer-Policy no-referrer     跳转到外站时不携带来源 URL
    #   X-Frame-Options DENY            禁止本站被嵌入 iframe，防点击劫持
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # HSTS：一年内浏览器只用 HTTPS 访问本域名。
    # 只约束当前子域名，避免影响 001769.xyz 上其他用途的主机。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # dotfile 不应成为前端资源；ACME 仅由上面的 HTTP 验证目录提供。
    # 匹配路径中任何以 "." 开头的段（如 /.env、/.git/config）。
    location ~ /\. {
        deny all;
    }

    # 只代理精确的公开存活检查路径，其余业务入口仍由后端认证。
    # "=" 为精确匹配，/health/xxx 之类的路径不会命中这里。
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件
    # 单页应用（SPA）回退：文件或目录不存在时返回 index.html，由前端路由处理 /papers/123 等路径。
    location / {
        try_files $uri $uri/ /index.html;
        # 首页及时获取新资源指纹，避免发布后继续使用旧前端入口。
        expires -1;
    }

    # Vite 指纹资源可以长期缓存；不用 location add_header 覆盖服务级 HSTS 等安全头。
    # （nginx 中 location 一旦定义 add_header，就不再继承 server 级的 add_header。）
    # 文件名带内容哈希（如 index-a1b2c3.js），内容变化文件名就变，缓存一年也不会拿到旧代码。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 后端 API 代理
    # "^~" 前缀匹配优先于正则 location，确保 /api/ 下的请求一定转发给后端。
    location ^~ /api/ {
        # proxy_pass 不带 URI 部分，请求路径原样转发（/api/xxx -> 后端 /api/xxx）。
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 单层代理覆盖客户端传入的 XFF；后端仅信任明确配置的代理 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 原样传递使用者的 JWT，代理本身不注入共享凭据。
        proxy_set_header Authorization $http_authorization;

        # SSE 流式传输支持（重要！）
        # 关闭缓冲和缓存，后端每产生一段数据就立即推给浏览器，否则流式回答会被攒成一整块才返回。
        proxy_buffering off;
        proxy_cache off;
        # 使用 HTTP/1.1 并清空 Connection 头，与后端保持长连接，支持分块传输。
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # 增加超时时间（论文解析可能较慢）
        # read_timeout：两次从后端读到数据的最长间隔，长时间生成/解析时需要足够大。
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 日志配置
    # 访问日志使用上方定义的脱敏格式 arxiv_safe。
    access_log /var/log/nginx/arxiv-agent-access.log arxiv_safe;
    error_log /var/log/nginx/arxiv-agent-error.log;
}
