# 不记录查询参数和认证头，避免误传的凭据进入长期访问日志。
log_format arxiv_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name arxiv.001769.xyz;

    # 续期仍走 HTTP-01；其他请求固定跳转到本站，不能用客户端 Host 拼接跳转目标。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://arxiv.001769.xyz$request_uri;
    }
    access_log /var/log/nginx/arxiv-agent-access.log arxiv_safe;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arxiv.001769.xyz;

    ssl_certificate /etc/letsencrypt/live/arxiv.001769.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arxiv.001769.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:arxiv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    root /opt/arxiv-research-agent/new_frontend/dist;

    # 当前 API 接收 JSON，PDF 由后端下载；与 AUTH_MAX_REQUEST_BYTES 默认值保持一致。
    client_max_body_size 1m;
    client_body_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # 只约束当前子域名，避免影响 001769.xyz 上其他用途的主机。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # dotfile 不应成为前端资源；ACME 仅由上面的 HTTP 验证目录提供。
    location ~ /\. {
        deny all;
    }

    # 只代理精确的公开存活检查路径，其余业务入口仍由后端认证。
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
        # 首页及时获取新资源指纹，避免发布后继续使用旧前端入口。
        expires -1;
    }

    # Vite 指纹资源可以长期缓存；不用 location add_header 覆盖服务级 HSTS 等安全头。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 后端 API 代理
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 单层代理覆盖客户端传入的 XFF；后端仅信任明确配置的代理 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 原样传递使用者的 JWT，代理本身不注入共享凭据。
        proxy_set_header Authorization $http_authorization;

        # SSE 流式传输支持（重要！）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;

        # 增加超时时间（论文解析可能较慢）
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 日志配置
    access_log /var/log/nginx/arxiv-agent-access.log arxiv_safe;
    error_log /var/log/nginx/arxiv-agent-error.log;
}
