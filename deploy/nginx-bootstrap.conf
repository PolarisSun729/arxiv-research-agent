# 仅首次签发证书使用：HTTP 上只提供 ACME 验证文件，不开放登录页面或 API。
# 签发完成后用 nginx.conf 替换同一个站点文件，避免同时启用两套同域配置。
server {
    listen 80;
    listen [::]:80;
    server_name arxiv.001769.xyz;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
    access_log off;
}
