# 仅首次签发证书使用：HTTP 上只提供 ACME 验证文件，不开放登录页面或 API。
# 签发完成后用 nginx.conf 替换同一个站点文件，避免同时启用两套同域配置。
#
# 背景：nginx.conf 的 443 server 引用了 Let's Encrypt 证书文件，证书尚不存在时 nginx 无法加载该配置。
# 因此首次部署先用本文件跑通 HTTP-01 验证，拿到证书后再换成正式配置。
#
# 使用步骤（详见 docs/operations/cicd-deployment.md 第 10 节）：
#   1. sudo install -d -m 755 /var/www/letsencrypt
#   2. 复制本文件到 /etc/nginx/sites-available/arxiv-agent，按实际情况替换域名，并链接到 sites-enabled
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot certonly --webroot -w /var/www/letsencrypt -d <你的域名>
server {
    # 同时监听 IPv4 与 IPv6 的 80 端口。
    listen 80;
    listen [::]:80;
    server_name arxiv.001769.xyz;
    # 错误页和响应头中不暴露 nginx 版本号。
    server_tokens off;

    # certbot 会把验证文件写到 /var/www/letsencrypt/.well-known/acme-challenge/ 下，
    # Let's Encrypt 通过 http://<域名>/.well-known/acme-challenge/<token> 访问以确认域名归属。
    # "^~" 表示前缀匹配成功后不再检查正则 location。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # 其余所有请求返回 503（服务暂不可用），在 HTTPS 就绪前不暴露任何应用页面。
    location / {
        return 503;
    }
    access_log off;
}
