# 线路机四层转发配置：线路机只负责回国线路，把 80/443 的 TCP 连接原样转给应用服务器。
#
# 背景：应用服务器回国线路较差，回国线路较好的线路机带宽小、内存少，不适合运行应用本身。
# 线路机不解密 TLS、不持有证书；证书、应用和数据都在应用服务器上（见 docs/operations/cicd-deployment.md 第 10 节）。
#
# 请求流向：浏览器 --> 线路机 nginx stream(80/443) --PROXY protocol--> 应用服务器 nginx(80/443)
#
# 使用方式（线路机上以 root 执行，先把 160.236.111.192 替换为应用服务器 IP）：
#   apt-get install -y libnginx-mod-stream
#   install -d /etc/nginx/stream.d
#   install -m 644 nginx-relay-stream.conf /etc/nginx/stream.d/arxiv-relay.conf
#   echo 'include /etc/nginx/stream.d/*.conf;' >> /etc/nginx/nginx.conf
# stream 块必须位于 http 块之外，因此追加在 nginx.conf 末尾，而不是放进 sites-enabled。
# 线路机上原本监听 80/443 的 http 站点要先移出 sites-enabled，否则端口冲突。
stream {
    server {
        listen 80;
        listen [::]:80;
        proxy_pass 160.236.111.192:80;
        # 在连接开头附上用户真实 IP；应用服务器只信任来自线路机的 PROXY 头。
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass 160.236.111.192:443;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # 默认 10 分钟无数据即断开；SSE 流式回答和长时间建索引期间可能较久没有数据，放宽到 1 小时。
        proxy_timeout 1h;
    }
}
