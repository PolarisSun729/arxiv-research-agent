name: quality-gate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_release:
        description: "质量门通过后生成 Debian 12 离线发布包"
        type: boolean
        default: false

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    # 原生 wheel 必须在与目标服务器一致的 glibc/Python 环境中构建。
    container: python:3.11-bookworm
    timeout-minutes: 90
    env:
      # 确保 UTF-8 编码以安全输出中文诊断信息
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      VITE_API_BASE_URL: /api

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git libgl1 libglib2.0-0 libmagic1

      - name: Checkout
        # 固定到已核验的 v4 提交，避免可变标签引入未经审计的供应链变更。
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trust workspace for subsequent Git commands
        # 容器运行用户可能不同于挂载目录属主；在后续步骤使用的配置中仅信任本工作区。
        # 提前验证 Git 可读，避免依赖安装和质量检查完成后才在发布打包阶段失败。
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD

      - name: Set up Node
        # Node 环境 Action 固定到 v4 当前提交，避免标签漂移影响质量门。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          # pip、wheel 也会被 freeze --all 记入发布锁，先按锁定版本安装，避免镜像或 pip 新版本改变发布锁哈希。
          python -m pip install --require-hashes -r requirements-bootstrap.lock.txt
          # 只按仓库中提交的锁文件安装：精确版本加哈希，CI 不再现场解析 requirements.txt 的版本范围。
          # PyTorch CPU 源只提供 +cpu 版 torch/torchvision；其余包的哈希来自 PyPI，不匹配的文件会被拒绝。
          python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock.txt
          python -m pip check
          # 发布锁只取运行时依赖；测试依赖在其后安装，测试锁中的运行时版本与上面一致（由依赖约定测试保证）。
          python -m pip freeze --all > /tmp/runtime-freeze.txt
          python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.lock.txt
          python -m pip check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unified quality gate
        run: python scripts/check_quality.py ci

      - name: Build offline release
        if: inputs.package_release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python deploy/package_release.py --commit "$RELEASE_COMMIT" --runtime-freeze /tmp/runtime-freeze.txt

      - name: Upload tested release
        if: inputs.package_release
        # 固定到 v4 提交；包内 wheel 已压缩，关闭二次压缩以减少打包开销。
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arxiv-release-${{ github.sha }}
          path: |
            temp/ci-release/release.tar.gz
            temp/ci-release/release.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
