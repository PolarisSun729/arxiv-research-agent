name: quality-gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: windows-latest
    env:
      # 英文 Windows Runner 默认控制台可能使用 CP1252，显式启用 UTF-8 以安全输出中文诊断信息。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        # 固定到已核验的 v4 提交，避免可变标签引入未经审计的供应链变更。
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        # Python 环境 Action 固定到 v5 当前提交，后续升级需显式审查。
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node
        # Node 环境 Action 固定到 v4 当前提交，避免标签漂移影响质量门。
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements_win.txt

      - name: Install frontend dependencies
        working-directory: new_frontend
        run: npm ci

      - name: Run unified quality gate
        run: python scripts/check_quality.py ci
