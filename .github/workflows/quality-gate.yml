name: quality-gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: new_frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements_win.txt

      - name: Install frontend dependencies
        working-directory: new_frontend
        run: npm ci

      - name: Run unified quality gate
        run: python scripts/check_quality.py ci
